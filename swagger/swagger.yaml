            - properties:
                error:
                  type: string
              type: object
      security:
      - PSKAuth: []
      summary: Trigger media extraction
      tags:
      - media
  /api/tts:
    post:
      consumes:
      - application/json
      description: |-
        Returns 202 immediately. In the background the text is cleaned
        (emoji, markdown, citations), translated to English when language is
        "en", and synthesized; the OGG/Opus audio is then delivered to wa-bot
        through its /callback/tts-done endpoint under the given jobId.
      parameters:
