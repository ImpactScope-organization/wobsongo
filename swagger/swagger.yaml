basePath: /
definitions:
  dto.AgentInboundRequest:
    properties:
      jid:
        description: Jid is the WhatsApp chat identifier this message came from.
        type: string
      text:
        description: Text is the raw inbound message text.
        type: string
    required:
    - jid
    - text
    type: object
  dto.AgentInboundResponse:
    properties:
      jobId:
        description: JobID is the job identifier returned to the bot.
        type: string
      message:
        description: Message contains the agent's response when the turn completes.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/dto.ExtractStatus'
        description: Status indicates the current state of the agent turn.
    type: object
  dto.AgentInboundVoiceRequest:
    properties:
      channel:
        description: Channel is the messaging platform the message came from.
        enum:
        - whatsapp
        - telegram
        type: string
      jid:
        description: JID is the chat identifier this voice message came from.
        type: string
      mediaRef:
        description: MediaRef is a Twilio media URL (whatsapp) or a file_id (telegram).
        maxLength: 2048
        type: string
      mimeType:
        description: MimeType is the audio MIME type reported by the platform.
        maxLength: 100
        type: string
    required:
    - channel
    - jid
    - mediaRef
    - mimeType
    type: object
  dto.ApifyResource:
    properties:
      defaultDatasetId:
        description: DefaultDatasetId is the ID of the dataset created by the Actor
          run.
        type: string
      status:
        description: Status indicates the final status of the Actor run (e.g., SUCCEEDED,
          FAILED).
        type: string
    required:
    - defaultDatasetId
    - status
    type: object
  dto.ApifyWebhookPayload:
    properties:
      eventType:
        description: EventType indicates the type of event that triggered the webhook.
        type: string
      resource:
        allOf:
        - $ref: '#/definitions/dto.ApifyResource'
        description: Resource contains details of the Apify Actor run that just finished.
    required:
    - eventType
    - resource
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 72
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.CheckClaimDTO:
    properties:
      is_long:
        description: |-
          IsLong controls FormattedMessage's verbosity: false (the default —
          note the zero-value already means short, no need to set this at all
          for the common case) shows a brief paraphrased explainer per
          sub-claim; true shows the full reasoning plus its evidence/citations.
          Only affects FormattedMessage — SubClaims/Citations are always fully
          populated in the structured response either way.
        type: boolean
      length:
        description: |-
          Length picks FormattedMessage's shape: "short", "medium", "long" or
          "expert". When empty or unknown, IsLong decides
          (true = "expert", false = "medium").
        type: string
      text:
        description: |-
          Text is the claim or message to check — may be a direct question, a
          casual claim, or a sentence pulled from a video transcript.
        type: string
    required:
    - text
    type: object
  dto.CitationResponse:
    properties:
      chunk_id:
        description: |-
          ChunkID is the chunk this evidence traces back to — combine with
          DocumentID to link directly to this evidence (e.g. the standalone
          /evidence PDF viewer: /evidence?document_id=...&chunk_id=...).
        type: string
      document_id:
        description: DocumentID is the source document this evidence came from.
        type: string
      index:
        description: |-
          Index is the same 0-based number the judge's Reasoning text references
          inline as "[N]" — use it to link a prose citation back to this entry.
        type: integer
      source:
        description: Source is "chunk" or "fact".
        type: string
      text:
        description: Text is the matched text — a chunk's text, or a fact's subject-predicate-object.
        type: string
    type: object
  dto.ClaimCheckResponse:
    properties:
      formatted_message:
        description: |-
          FormattedMessage is a human-facing, color-coded (emoji-per-verdict)
          rendering of OverallSummary and every sub-claim's verdict/reasoning —
          meant to be displayed as-is by a chat client. Plain text, no
          HTML/Markdown markup. Empty when InScope is false.
        type: string
      in_scope:
        description: |-
          InScope is false if the input wasn't a health-related inquiry at all —
          this system doesn't take inquiries unrelated to health.
        type: boolean
      overall_summary:
        description: |-
          OverallSummary is a short rollup across every sub-claim's verdict.
          Empty when InScope is false.
        type: string
      refusal_reason:
        description: RefusalReason explains why InScope is false. Empty when InScope
          is true.
        type: string
      sub_claims:
        description: SubClaims is the per-sub-claim breakdown. Empty when InScope
          is false.
        items:
          $ref: '#/definitions/dto.SubClaimResponse'
        type: array
    type: object
  dto.CreateDocumentDTO:
    properties:
      file_key:
        description: FileKey is the object storage key (e.g., S3/MinIO) where the
          document file was uploaded.
        type: string
      filename:
        description: Filename is the name of the document file.
        type: string
      filesize:
        description: Filesize is the size of the document file in bytes.
        type: integer
      filetype:
        description: Filetype is the mime type of the document file (e.g., "application/pdf",
          "text/plain").
        type: string
      language:
        description: |-
          Language is the document's language ("en" or "fr") — required, not
          auto-detected, since French must be first-class for this deployment
          and silently defaulting risks mis-tagging a document.
        enum:
        - en
        - fr
        type: string
      page_count:
        description: PageCount is the number of pages in the document.
        type: integer
      publication_year:
        description: PublicationYear is the year the document was published.
        type: integer
      publisher_name:
        description: PublisherName is the name of the publisher of the document.
        type: string
      sha256:
        description: SHA256 is the SHA256 hash of the document content.
        type: string
      title:
        description: Title is the title of the document.
        type: string
    required:
    - file_key
    - filename
    - filesize
    - filetype
    - language
    - page_count
    - sha256
    - title
    type: object
  dto.CreateInfluencerRequest:
    properties:
      username:
        description: Username is the TikTok username, with or without a leading @.
        example: '@someone'
        type: string
    required:
    - username
    type: object
  dto.CreateKeywordRequest:
    properties:
      is_active:
        description: IsActive defaults to true when left out.
        example: true
        type: boolean
      keyword:
        description: Keyword is the search text used on the platform.
        example: vaccin
        maxLength: 100
        minLength: 2
        type: string
      language:
        description: Language is the language of the keyword, "en" or "fr".
        enum:
        - en
        - fr
        example: fr
        type: string
    required:
    - keyword
    - language
    type: object
  dto.CreateTopicRequest:
    properties:
      description:
        description: Description explains what the topic covers. The claim analyzer
          reads it.
        example: Claims about diseases and vaccines
        maxLength: 1000
        type: string
      is_active:
        description: IsActive defaults to true when left out.
        example: true
        type: boolean
      name:
        description: Name is the unique display name of the topic.
        example: Health
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.ExtractAPIRequest:
    properties:
      question:
        description: Question is a free-text question to search the knowledge base.
        type: string
      url:
        description: URL is the target media link provided by the bot.
        type: string
    type: object
  dto.ExtractData:
    properties:
      transcript:
        description: Transcript contains the transcribed text from the tiktok video.
        type: string
    type: object
  dto.ExtractResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/dto.ExtractData'
        description: Data contains the final extraction results. It is omitted if
          the job is not yet completed.
      error:
        description: Error contains the error message if the extraction failed. It
          is omitted otherwise.
        type: string
      jobId:
        description: JobID is the unique identifier for the extraction task.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/dto.ExtractStatus'
        description: Status indicates the current state of the extraction job.
    type: object
  dto.ExtractStatus:
    enum:
    - processing
    - completed
    - failed
    - rejected
    type: string
    x-enum-varnames:
    - StatusProcessing
    - StatusCompleted
    - StatusFailed
    - StatusRejected
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        type: string
    required:
    - email
    - password
    type: object
  dto.MeResponse:
    properties:
      email:
        type: string
      id:
        format: uuid
        type: string
      name:
        type: string
      password_changed_at:
        type: string
      role:
        description: Role is one of "user", "admin" or "superadmin".
        enum:
        - user
        - admin
        - superadmin
        type: string
    required:
    - email
    - id
    - name
    - password_changed_at
    - role
    type: object
  dto.PaginationResults-model_DashboardCreator:
    properties:
      items:
        description: Items contains the paginated data items
        items:
          $ref: '#/definitions/model.DashboardCreator'
        type: array
      page:
        description: Page is the current page number
        type: integer
      per_page:
        description: PerPage is the number of items per page
        maximum: 100
        type: integer
      total_items:
        description: TotalItems is the total number of items available
        type: integer
    required:
    - page
    - per_page
    - total_items
    type: object
  dto.PaginationResults-model_DiscoveryKeyword:
    properties:
      items:
        description: Items contains the paginated data items
        items:
          $ref: '#/definitions/model.DiscoveryKeyword'
        type: array
      page:
        description: Page is the current page number
        type: integer
      per_page:
        description: PerPage is the number of items per page
        maximum: 100
        type: integer
      total_items:
        description: TotalItems is the total number of items available
        type: integer
    required:
    - page
    - per_page
    - total_items
    type: object
  dto.PaginationResults-model_Document:
    properties:
      items:
        description: Items contains the paginated data items
        items:
          $ref: '#/definitions/model.Document'
        type: array
      page:
        description: Page is the current page number
        type: integer
      per_page:
        description: PerPage is the number of items per page
        maximum: 100
        type: integer
      total_items:
        description: TotalItems is the total number of items available
        type: integer
    required:
    - page
    - per_page
    - total_items
    type: object
  dto.PaginationResults-model_Influencer:
    properties:
      items:
        description: Items contains the paginated data items
        items:
          $ref: '#/definitions/model.Influencer'
        type: array
      page:
        description: Page is the current page number
        type: integer
      per_page:
        description: PerPage is the number of items per page
        maximum: 100
        type: integer
      total_items:
        description: TotalItems is the total number of items available
        type: integer
    required:
    - page
    - per_page
    - total_items
    type: object
  dto.PaginationResults-model_Narrative:
    properties:
      items:
        description: Items contains the paginated data items
        items:
          $ref: '#/definitions/model.Narrative'
        type: array
      page:
        description: Page is the current page number
        type: integer
      per_page:
        description: PerPage is the number of items per page
        maximum: 100
        type: integer
      total_items:
        description: TotalItems is the total number of items available
        type: integer
    required:
    - page
    - per_page
    - total_items
    type: object
  dto.PaginationResults-model_Topic:
    properties:
      items:
        description: Items contains the paginated data items
        items:
          $ref: '#/definitions/model.Topic'
        type: array
      page:
        description: Page is the current page number
        type: integer
      per_page:
        description: PerPage is the number of items per page
        maximum: 100
        type: integer
      total_items:
        description: TotalItems is the total number of items available
        type: integer
    required:
    - page
    - per_page
    - total_items
    type: object
  dto.PresignedURL:
    properties:
      presigned_url:
        type: string
      ttl:
        type: integer
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.SetInfluencerActiveRequest:
    properties:
      is_active:
        example: false
        type: boolean
    required:
    - is_active
    type: object
  dto.SignupRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.SubClaimResponse:
    properties:
      brief_reasoning:
        description: |-
          BriefReasoning is a short, self-contained paraphrase of Reasoning,
          safe to display without the citations list alongside it.
        type: string
      citations:
        description: |-
          Citations are the specific pieces of knowledge-base evidence the
          verdict is based on. Empty whenever Verdict is insufficient_evidence.
        items:
          $ref: '#/definitions/dto.CitationResponse'
        type: array
      claim:
        description: Claim is the normalized sub-claim text that was actually checked.
        type: string
      high_risk_caution:
        description: |-
          HighRiskCaution is true when the forced-RED safety override fired
          (response-rule.txt section 4: tobacco/alcohol/illicit drugs, an
          unregulated homemade mixture, or self-medication) — Verdict is forced
          to "contradicted" whenever this is true, regardless of what the
          evidence otherwise showed.
        type: boolean
      reasoning:
        description: Reasoning is the judge's explanation for the verdict.
        type: string
      recommend_medical_consult:
        description: |-
          RecommendMedicalConsult is true whenever the claim's subject matter
          warrants recommending a real doctor — this system provides quick
          access to reliable information, it does not replace one.
        type: boolean
      severity:
        description: 'Severity is one of: routine, serious, emergency.'
        type: string
      verdict:
        description: |-
          Verdict is one of: supported, contradicted, partially_supported, mixed, insufficient_evidence.
          insufficient_evidence never implies the claim itself is right or wrong
          — only that the knowledge base had nothing relevant to check it against.
        type: string
    type: object
  dto.TTSRequest:
    properties:
      jobId:
        description: |-
          JobID is the bot's correlation ID (its pending job). The finished audio
          is reported back to the bot under this ID.
        type: string
      language:
        description: 'Language is the language the audio is spoken in: "fr" or "en".'
        enum:
        - fr
        - en
        type: string
      text:
        description: |-
          Text is the bot reply to speak. It is French. For Language "en" it is
          translated before synthesis.
        type: string
    required:
    - jobId
    - language
    - text
    type: object
  dto.TTSResponse:
    properties:
      jobId:
        type: string
      status:
        type: string
    type: object
  dto.TokenPairResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
    required:
    - access_expires_at
    - access_token
    - refresh_expires_at
    - refresh_token
    type: object
  dto.UpdateAdminSettingRequest:
    properties:
      discovery_interval_hours:
        description: DiscoveryIntervalHours defines the interval between scheduled
          discovery runs in hours.
        maximum: 720
        minimum: 1
        type: integer
      max_cost_per_run:
        description: MaxCostPerRun defines the maximum allowed cost per run.
        maximum: 1000
        minimum: 0.01
        type: number
      max_results_influencer:
        description: MaxResultsInfluencer defines the maximum number of posts to retrieve
          per influencer.
        maximum: 100
        minimum: 1
        type: integer
      max_results_keyword:
        description: MaxResultsKeyword defines the maximum number of posts to retrieve
          per keyword.
        maximum: 100
        minimum: 1
        type: integer
    required:
    - discovery_interval_hours
    - max_results_influencer
    - max_results_keyword
    type: object
  dto.UpdateDocumentDTO:
    properties:
      publication_year:
        description: PublicationYear is the year the document was published.
        type: integer
      publisher_name:
        description: PublisherName is the name of the publisher of the document.
        type: string
      title:
        description: Title is the title of the document.
        type: string
    required:
    - title
    type: object
  dto.UpdateKeywordRequest:
    properties:
      is_active:
        example: true
        type: boolean
      keyword:
        example: vaccin
        maxLength: 100
        minLength: 2
        type: string
      language:
        enum:
        - en
        - fr
        example: fr
        type: string
    required:
    - is_active
    - keyword
    - language
    type: object
  dto.UpdateProfileRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - email
    - name
    type: object
  dto.UpdateTopicRequest:
    properties:
      description:
        example: Claims about diseases and vaccines
        maxLength: 1000
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Health
        maxLength: 100
        minLength: 2
        type: string
    required:
    - is_active
    - name
    type: object
  model.APIResponse:
    properties:
      data: {}
      error:
        type: string
      request_id:
        format: uuid
        type: string
      status:
        maximum: 599
        minimum: 100
        type: integer
    required:
    - request_id
    - status
    type: object
  model.AdminSetting:
    properties:
      discovery_interval_hours:
        type: integer
      max_cost_per_run:
        description: |-
          MaxCostPerRun is the maximum cost (USD) allowed for a single discovery or
          monitoring run. If the Apify actor reports a higher cost, the run is
          considered failed.
        type: number
      max_results_influencer:
        description: MaxResultsInfluencer is how many recent videos to fetch per creator
          check.
        type: integer
      max_results_keyword:
        description: MaxResultsKeyword is how many videos to fetch per discovery keyword.
        type: integer
      updated_at:
        type: string
      updated_by:
        format: uuid
        type: string
    type: object
  model.ClaimPlatformCount:
    properties:
      claims:
        description: Claims is the number of claims from that platform.
        type: integer
      platform:
        description: Platform is where the claims came from, e.g. "whatsapp" or "tiktok".
        type: string
    type: object
  model.DashboardCreator:
    properties:
      avatar_url:
        type: string
      followers_count:
        type: integer
      id:
        type: string
      nickname:
        type: string
      platform:
        type: string
      posts_count:
        description: PostsCount is the number of posts in the requested window.
        type: integer
      profile_url:
        type: string
      username:
        type: string
    type: object
  model.DiscoveryKeyword:
    properties:
      created_at:
        type: string
      id:
        format: uuid
        type: string
      is_active:
        type: boolean
      keyword:
        type: string
      language:
        $ref: '#/definitions/model.Language'
      language_code:
        $ref: '#/definitions/model.LanguageCode'
      last_run_at:
        type: string
      updated_at:
        type: string
    type: object
  model.Document:
    properties:
      created_at:
        description: CreatedAt is the timestamp when the document was created.
        type: string
      file_url_presigned:
        description: FileURLPresigned is the presigned URL for accessing the document
          file.
        type: string
      filename:
        description: Filename is the name of the document file.
        type: string
      filesize:
        description: Filesize is the size of the document file in bytes.
        type: integer
      filetype:
        description: Filetype is the mime type of the document file (e.g., "application/pdf",
          "text/plain").
        type: string
      id:
        description: ID is the unique identifier for the document.
        type: string
      ingested_at:
        description: IngestedAt is the timestamp when the document was ingested into
          the system.
        type: string
      language:
        allOf:
        - $ref: '#/definitions/model.Language'
        description: |-
          Language is the language this document is written in, set explicitly
          at ingestion (e.g. `wob document insert --language fr`) rather than
          auto-detected — the cheapest, most reliable option for now.
      modified_at:
        description: ModifiedAt is the timestamp when the document was last modified.
        type: string
      page_count:
        description: PageCount is the number of pages in the document (if applicable).
        type: integer
      publication_year:
        description: PublicationYear is the year the document was published.
        type: integer
      publisher_name:
        description: PublisherName is the name of the publisher of the document.
        type: string
      sha256:
        description: SHA256 is the SHA256 hash of the document content.
        type: string
      title:
        description: Title is the title of the document.
        type: string
    required:
    - created_at
    - filename
    - filesize
    - filetype
    - id
    - language
    - modified_at
    - page_count
    - sha256
    - title
    type: object
  model.Influencer:
    properties:
      avatar_url:
        description: AvatarURL is the URL of the influencer's profile picture.
        type: string
      avg_upload_interval_hours:
        description: AvgUploadIntervalHours is the average time between tracked uploads.
        type: number
      bio:
        description: Bio is the influencer's profile bio.
        type: string
      created_at:
        description: CreatedAt is the time when the record was created.
        type: string
      discovered_from_video_url:
        description: DiscoveredFromVideoURL is the video URL where the influencer
          was discovered.
        type: string
      discovered_via_keyword:
        description: DiscoveredViaKeyword is the keyword that led to the influencer's
          discovery.
        type: string
      empty_check_count:
        description: |-
          EmptyCheckCount is how many checks in a row found no usable video. The
          influencer is deactivated when it reaches the limit.
        type: integer
      first_video_at:
        description: FirstVideoAt is the earliest tracked video time.
        type: string
      followers_count:
        description: FollowersCount is the number of followers.
        type: integer
      following_count:
        description: FollowingCount is the number of accounts the influencer follows.
        type: integer
      hearts_count:
        description: HeartsCount is the total number of likes received by the influencer.
        type: integer
      id:
        description: ID is the unique identifier of the influencer.
        type: string
      is_active:
        description: IsActive reports whether the influencer is monitored.
        type: boolean
      last_checked_at:
        description: LastCheckedAt is the last time the influencer was checked for
          new videos.
        type: string
      last_video_at:
        description: LastVideoAt is the latest tracked video time.
        type: string
      next_check_at:
        description: |-
          NextCheckAt is when the influencer should next be checked for new
          videos, based on their average upload interval.
        type: string
      nickname:
        description: Nickname is the influencer's display name.
        type: string
      platform:
        description: Platform is the social media platform of the influencer.
        type: string
      profile_url:
        description: ProfileURL is the URL of the influencer's profile.
        type: string
      reported_video_count:
        description: ReportedVideoCount is the total number of videos reported by
          TikTok/Apify.
        type: integer
      source:
        allOf:
        - $ref: '#/definitions/model.InfluencerSource'
        description: Source indicates how the influencer was added to the system.
      tracked_video_count:
        description: TrackedVideoCount is the number of videos captured by the monitoring
          system.
        type: integer
      updated_at:
        description: UpdatedAt is the time when the record was last updated.
        type: string
      username:
        description: Username is the influencer's username.
        type: string
      verified:
        description: Verified indicates whether the influencer's account is verified.
        type: boolean
    type: object
  model.InfluencerSource:
    enum:
    - seed
    - discovered
    type: string
    x-enum-varnames:
    - InfluencerSourceSeed
    - InfluencerSourceDiscovered
  model.Language:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - LanguageEnglish
    - LanguageFrench
  model.LanguageCode:
    enum:
    - en
    - fr
    type: string
    x-enum-varnames:
    - LanguageCodeEnglish
    - LanguageCodeFrench
  model.MessageVolume:
    properties:
      current:
        description: Current is the number of messages in the selected window.
        type: integer
      previous:
        description: Previous is the number of messages in the window before it.
        type: integer
      trend:
        description: |-
          Trend is the current window's volume per bucket, oldest first: hourly
          for 24h, daily for 7d and 30d.
        items:
          type: integer
        type: array
    type: object
  model.Narrative:
    properties:
      created_at:
        description: CreatedAt is the time the narrative was created.
        type: string
      harm:
        description: |-
          Harm is the harm level between NarrativeHarmMin and NarrativeHarmMax.
          Until an expert validates it, the system estimates it from the severity
          and high-risk flag of the newest claim. Nil while there is no estimate.
        type: integer
      harm_validated:
        description: |-
          HarmValidated is true once an expert confirmed or set Harm. The system
          then stops recomputing Harm.
        type: boolean
      id:
        description: ID is the unique identifier of the narrative.
        format: uuid
        type: string
      is_active:
        description: |-
          IsActive reports whether the narrative is still actively discussed,
          based on activity observed within a defined time period: it is true
          while a linked claim occurred inside the activity window. The system
          sets it to true when a claim joins the narrative, and back to false when
          the window passes without new claims.
        type: boolean
      statement:
        description: |-
          Statement describes the narrative. An LLM writes it, deliberately broad,
          when the narrative is created, and an admin may edit it afterwards.
        type: string
      statement_edited_at:
        description: StatementEditedAt is when Statement was last edited by an admin.
        type: string
      statement_edited_by:
        description: |-
          StatementEditedBy is the admin who last edited Statement. Nil while the
          LLM-written statement is untouched.
        format: uuid
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.NarrativeStatus'
        description: Status is the narrative's fact-check status.
      topic_id:
        description: |-
          TopicID is the topic the narrative belongs to. A claim is only matched
          against narratives of its own topic.
        format: uuid
        type: string
      topic_name:
        description: TopicName is the name of the narrative's topic.
        type: string
      updated_at:
        description: UpdatedAt is the time the narrative was last modified.
        type: string
      verdict:
        description: |-
          Verdict is the verdict of the narrative's newest claim (supported,
          contradicted, partially_supported, mixed or insufficient_evidence).
          Nil while the narrative has no claim.
        type: string
    type: object
  model.NarrativeStatus:
    enum:
    - needs_check
    - auto_checked
    - not_in_kb
    - expert_verified
    type: string
    x-enum-varnames:
    - NarrativeStatusNeedsCheck
    - NarrativeStatusAutoChecked
    - NarrativeStatusNotInKB
    - NarrativeStatusExpertVerified
  model.POSTUploadPolicy:
    properties:
      formFields:
        additionalProperties:
          type: string
        type: object
      prefix:
        example: avatars/
        type: string
      url:
        example: https://s3.planetleague.co.uk/bucket/key
        type: string
    required:
    - formFields
    - prefix
    - url
    type: object
  model.Topic:
    properties:
      created_at:
        description: CreatedAt is the time the topic was created.
        type: string
      description:
        description: |-
          Description explains what the topic covers. It is included in the
          analyzer prompt so the model can classify claims accurately.
        type: string
      id:
        description: ID is the unique identifier of the topic.
        format: uuid
        type: string
      is_active:
        description: |-
          IsActive reports whether the analyzer may still assign this topic to
          new claims. Existing claims and narratives keep an inactive topic.
        type: boolean
      name:
        description: Name is the topic's display name. It is unique across all topics.
        type: string
      updated_at:
        description: UpdatedAt is the time the topic was last modified.
        type: string
    type: object
  model.UserActivity:
    properties:
      messages:
        description: Messages is the number of messages users sent.
        type: integer
      users:
        description: Users is the number of distinct jids that sent at least one message.
        type: integer
    type: object
info:
  contact: {}
  description: Fact-checking backend for the WobSongo dashboard and messaging bots.
  title: WobSongo API
  version: "1.0"
paths:
  /api/agent/inbound:
    post:
      consumes:
      - application/json
      description: |-
        Single entry point for every inbound WhatsApp message. Applies a
        deterministic fast path for bare TikTok URLs (straight to the existing
        cache-check/Apify pipeline) and routes everything else through the
        conversational agent (tool-calling over claim-checking and video
        processing, with per-jid conversation history).
      parameters:
      - description: Inbound Message
        in: body
        name: form
        required: true
        schema:
          $ref: '#/definitions/dto.AgentInboundRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AgentInboundResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
      security:
      - PSKAuth: []
      summary: Handle an inbound WhatsApp message
      tags:
      - agent
  /api/agent/inbound-voice:
    post:
      consumes:
      - application/json
      description: |-
        Receives a reference to a voice message (a Twilio media URL or a
        Telegram file_id), not the audio itself. The audio is downloaded,
        transcribed in the background and the transcript is routed through the
        conversational agent. The answer is delivered through the same
        callback as /agent/inbound.
      parameters:
      - description: Inbound voice message
        in: body
        name: form
        required: true
        schema:
          $ref: '#/definitions/dto.AgentInboundVoiceRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AgentInboundResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
        "415":
          description: Unsupported Media Type
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
      security:
      - PSKAuth: []
      summary: Handle an inbound voice message
      tags:
      - agent
  /api/extract:
    post:
      consumes:
      - application/json
      description: Enqueues a job to extract media from a target URL using Apify.
      parameters:
      - description: Extraction Request Form
        in: body
        name: form
        required: true
        schema:
