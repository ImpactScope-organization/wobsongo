              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
        "503":
          description: Service Unavailable
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                error:
                  type: string
              type: object
      security:
      - PSKAuth: []
      summary: Start synthesizing a bot reply as a voice message
      tags:
      - agent
